<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<link rel="stylesheet" href="w3_app_irisha.css">

</head>
<body>

<!-- Navbar -->
<nav class="navbar">
  <div class="logo">QuizVerse</div>
  <div class="hamburger">&#9776;</div>

  <ul class="nav-links">
    <li><a href="home.html">Home</a></li>
    <li><a href="categories.html">Categories</a></li>
    <li><a href="leaderboard.html">Leaderboard</a></li>
    <li><a href="login.html">Login</a></li>
    <li><a href="contact.html">Contact</a></li>
  </ul>
</nav>

<!-- Hero Section -->
<section class="hero">
  <h1 id="heroTitle">Welcome to QuizVerse</h1>
  <p>Test knowledge. Challenge friends. Learn smarter.</p>

  <!-- Button to show effects -->
  <button id="effectBtn" class="heroBtn">Quiz</button>
</section>

<!-- Featured Categories -->
<section class="features">
  <h2>Featured Categories</h2>

<div class="cards">

  <a href="Science and technology.html" class="card">
    <img src="https://quizizz.com/media/resource/gs/quizizz-media/quizzes/9a6ccfc3-cd73-45a4-8c4f-b300b2b62afb" alt="Math">
    <p>Science and technology</p>
  </a>

  <a href="History and Culture.html" class="card">
    <img src="https://assets.thehansindia.com/h-upload/2019/10/22/228670-1.webp" alt="Science">
    <p>History and Culture</p>
  </a>

  <a href="Critical Thinking.html" class="card">
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSkKNO9U2VIblh4V5ThWvtMB_7kSMIwaQKNQg&s" alt="General Knowledge">
    <p>Critical Thinking</p>
  </a>

  <a href="Current Affairs.html" class="card">
    <img src="https://is2-ssl.mzstatic.com/image/thumb/Purple71/v4/16/9f/5a/169f5ae2-c89f-fc3e-ea01-0a35c92e2ca1/source/512x512bb.jpg" alt="Sports">
    <p>Current Affairs</p>
  </a>

</div>

</section>

<!-- jQuery Functions -->
<script>

// 1. Navbar Mobile Toggle (slide)
$(document).ready(function () {
  $(".hamburger").click(function () {
    $(".nav-links").slideToggle();
  });
});

// 2. Fade toggle effect for Hero title
$(document).ready(function () {
  $("#effectBtn").click(function () {
    $("#heroTitle").fadeToggle(1000);
  });
});

// 3. Animate categories (move right)
$(document).ready(function () {
  $("#effectBtn").click(function () {
    $(".card").animate({ marginLeft: "20px" }, 600)
               .animate({ marginLeft: "0px" }, 600);
  });
});

// 4. Slide up categories on double-click
$(document).ready(function () {
  $(".features h2").dblclick(function () {
    $(".cards").slideUp("slow");
  });
});

</script>
</body>
</html>
