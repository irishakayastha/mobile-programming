<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuizVerse – Profile CRUD</title>

  <style>
    body { font-family: Arial; background: #eef2ff; padding: 20px; }
    h1 { text-align: center; }
    form, .container {
      background: white; padding: 20px; border-radius: 10px;
      max-width: 400px; margin: 15px auto;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    input, select { width: 100%; padding: 10px; margin: 8px 0; border-radius: 8px; border: 1px solid #ccc; }
    button {
      width: 100%; padding: 12px; border: none; border-radius: 8px;
      background: #2563eb; color: white; font-size: 16px; margin-top: 10px;
    }
    ul { list-style: none; padding: 0; max-width: 400px; margin: auto; }
    li { background: white; padding: 12px; margin: 8px 0; border-radius: 8px; box-shadow: 0 0 6px rgba(0,0,0,0.1); }
    .actions button { width: 48%; padding: 8px; margin-top: 5px; border-radius: 6px; font-size: 14px; }
    .update-btn { background: #fbbf24; color: black; }
    .delete-btn { background: #dc2626; color: white; }
  </style>
</head>
<body>

  <h1>QuizVerse – Profile CRUD</h1>

  <!-- CREATE / UPDATE FORM -->
  <form id="profileForm">
    <input type="hidden" id="recordId" />

    <input type="text" id="fullName" placeholder="Full Name" required />
    <input type="email" id="email" placeholder="Email" required />
    <input type="text" id="username" placeholder="Username" required />
    <input type="text" id="favCategory" placeholder="Favorite Category" required />
    <input type="number" id="age" placeholder="Age" required min="1" max="120" />
    <select id="gender" required>
      <option value="">Select Gender</option>
      <option value="Male">Male</option>
      <option value="Female">Female</option>
      <option value="Other">Other</option>
      <option value="Prefer not to say">Prefer not to say</option>
    </select>
    <button type="submit">Save Profile</button>
  </form>
  <h2 style="text-align:center;">Live Profiles (Realtime)</h2>
  <ul id="profileList"></ul>
  <script type="module" src="scripts_w6.js"></script>
</body>
</html>
